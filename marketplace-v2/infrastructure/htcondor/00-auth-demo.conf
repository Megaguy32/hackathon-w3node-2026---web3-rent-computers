# DEMO ONLY. CLAIMTOBE does not authenticate peers; it trusts claimed identities.
# Use only on an isolated demo pool with strict firewall allowlists.
SEC_DEFAULT_AUTHENTICATION = OPTIONAL
SEC_DEFAULT_AUTHENTICATION_METHODS = CLAIMTOBE

# The demo firewall must restrict TCP/9618 to the marketplace host and the
# provider's public egress IP. Do NOT expose this pool to the public Internet.
ALLOW_READ = *
ALLOW_WRITE = *
ALLOW_NEGOTIATOR = *
ALLOW_DAEMON = *
ALLOW_ADMINISTRATOR = $(CONDOR_HOST)
