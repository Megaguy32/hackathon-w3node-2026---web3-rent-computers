        {
          "id": 5,
          "type": "timeseries",
          "title": "Pod phases over time (default namespace)",
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 17
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(kube_pod_status_phase{namespace=\"default\",phase=\"Pending\"})",
              "legendFormat": "Pending",
              "refId": "A"
            },
            {
              "expr": "sum(kube_pod_status_phase{namespace=\"default\",phase=\"Running\"})",
              "legendFormat": "Running",
              "refId": "B"
            },
            {
              "expr": "sum(kube_pod_status_phase{namespace=\"default\",phase=\"Succeeded\"})",
              "legendFormat": "Succeeded",
              "refId": "C"
            },
            {
              "expr": "sum(kube_pod_status_phase{namespace=\"default\",phase=\"Failed\"})",
              "legendFormat": "Failed",
              "refId": "D"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
