apiVersion: v1
kind: ConfigMap
metadata:
  name: w3node-compute-demo-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  w3node-compute-demo.json: |-
    {
      "uid": "w3node-compute-demo",
      "title": "W3Node Compute Rental Demo",
      "tags": ["w3node", "kubernetes", "interlink"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "5s",
      "time": { "from": "now-30m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "interLink virtual node Ready",
          "description": "Kubernetes control-plane view of the interLink virtual node. This does not measure provider CPU usage.",
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "max(kube_node_status_condition{node=\"interlink-node\",condition=\"Ready\",status=\"true\"})", "refId": "A" }],
          "fieldConfig": { "defaults": { "mappings": [{ "type": "value", "options": { "0": { "text": "Not Ready", "color": "red" }, "1": { "text": "Ready", "color": "green" } } }], "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] } }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "orientation": "auto", "colorMode": "background", "graphMode": "none", "textMode": "value_and_name" }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Default namespace: running Pods",
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "sum(kube_pod_status_phase{namespace=\"default\",phase=\"Running\"})", "refId": "A" }],
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [{ "color": "gray", "value": null }, { "color": "green", "value": 1 }] } }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "value", "graphMode": "area", "textMode": "auto" }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Default namespace: succeeded Pods",
          "gridPos": { "h": 5, "w": 6, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "sum(kube_pod_status_phase{namespace=\"default\",phase=\"Succeeded\"})", "refId": "A" }],
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [{ "color": "gray", "value": null }, { "color": "green", "value": 1 }] } }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "value", "graphMode": "area", "textMode": "auto" }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Default namespace: failed Pods",
          "gridPos": { "h": 5, "w": 6, "x": 18, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "sum(kube_pod_status_phase{namespace=\"default\",phase=\"Failed\"})", "refId": "A" }],
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 1 }] } }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "value", "graphMode": "area", "textMode": "auto" }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Pod phases over time (default namespace)",
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 5 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum(kube_pod_status_phase{namespace=\"default\",phase=\"Pending\"})", "legendFormat": "Pending", "refId": "A" },
            { "expr": "sum(kube_pod_status_phase{namespace=\"default\",phase=\"Running\"})", "legendFormat": "Running", "refId": "B" },
            { "expr": "sum(kube_pod_status_phase{namespace=\"default\",phase=\"Succeeded\"})", "legendFormat": "Succeeded", "refId": "C" },
            { "expr": "sum(kube_pod_status_phase{namespace=\"default\",phase=\"Failed\"})", "legendFormat": "Failed", "refId": "D" }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "drawStyle": "line", "lineInterpolation": "stepAfter", "fillOpacity": 15, "showPoints": "never" } }, "overrides": [] },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Container restarts (default namespace)",
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 5 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace=\"default\"}[5m]))", "legendFormat": "{{pod}}", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "options": { "legend": { "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } }
        }
      ]
    }
