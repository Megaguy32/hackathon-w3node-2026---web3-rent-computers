{{if not .Listings}}
  <p class="muted">No listings indexed yet. Publish one using the provider wallet above.</p>
{{else}}
  <div class="table-wrap"><table><thead><tr><th>ID</th><th>Provider</th><th>Machine</th><th>Price (wei)</th><th>Duration</th><th>Action</th></tr></thead><tbody>
  {{range .Listings}}<tr><td>{{.ListingID}}</td><td><code>{{short .Provider}}</code></td><td><code>{{.MachineName}}</code></td><td><code>{{eth .PriceWei}} ETH</code></td><td>{{duration .DurationSeconds}}</td><td><button type="button" class="rent-button" data-listing-id="{{.ListingID}}" data-price-wei="{{.PriceWei}}">Rent</button></td></tr>{{end}}
  </tbody></table></div>
{{end}}
